name: Install original result figures in report

on:
  push:
    branches:
      - submission-ready
    paths:
      - ".github/report-figures.patch"
      - ".github/workflows/apply-report-figures.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out submission branch
        uses: actions/checkout@v4
        with:
          ref: submission-ready
          fetch-depth: 0

      - name: Replace synthetic charts with original analysis figures
        run: |
          set -euo pipefail
          patch -p3 < .github/report-figures.patch
          rm .github/report-figures.patch
          rm .github/workflows/apply-report-figures.yml

      - name: Commit revised report source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Feature original coherent and Libra figures in report"
          git push origin submission-ready
