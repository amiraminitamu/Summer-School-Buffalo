name: Apply author-style report revision

on:
  push:
    branches:
      - submission-ready
    paths:
      - ".github/workflows/rewrite-report-once.yml"

permissions:
  contents: write

jobs:
  rewrite-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out submission branch
        uses: actions/checkout@v4
        with:
          ref: submission-ready

      - name: Reconstruct revised LaTeX source
        run: |
          cat .github/report-rewrite/chunk1.b64 \
              .github/report-rewrite/chunk2.b64 \
              .github/report-rewrite/chunk3.b64 \
              .github/report-rewrite/chunk4.b64 \
            | base64 --decode > report/Project_Report.tex
          echo "45fac879a972609404df7a9ec397772cc1fac7e3f61adaa48967cb4c43551b74  report/Project_Report.tex" \
            | sha256sum --check

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-science texlive-pictures lmodern

      - name: Compile revised report
        working-directory: report
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error Project_Report.tex

      - name: Commit source and PDF, then remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/report-rewrite/chunk1.b64 \
                 .github/report-rewrite/chunk2.b64 \
                 .github/report-rewrite/chunk3.b64 \
                 .github/report-rewrite/chunk4.b64 \
                 .github/workflows/rewrite-report-once.yml
          git add report/Project_Report.tex report/Project_Report.pdf
          git commit -m "Revise capstone report in author manuscript style"
          git push origin submission-ready
