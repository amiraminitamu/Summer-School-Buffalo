name: Build capstone report

on:
  push:
    branches:
      - submission-ready
    paths:
      - "report/Project_Report.tex"
      - "results/figures/**"
      - ".github/report-figures.patch"
      - ".github/workflows/build-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission-ready
          fetch-depth: 0

      - name: Install original analysis figures in report source
        run: |
          set -euo pipefail
          if [ -f .github/report-figures.patch ]; then
            patch -p3 < .github/report-figures.patch
            rm .github/report-figures.patch
            rm -f .github/workflows/apply-report-figures.yml
          fi

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-science lmodern

      - name: Compile report
        working-directory: report
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error Project_Report.tex

      - name: Commit revised source and compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Report source and PDF are current."
          else
            git commit -m "Feature original coherent and Libra figures in report"
            git push origin submission-ready
          fi
