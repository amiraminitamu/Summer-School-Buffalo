name: Build capstone report

on:
  push:
    branches:
      - submission-ready
    paths:
      - "report/Project_Report.tex"
      - "results/figures/**"
      - ".github/workflows/build-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission-ready
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-science lmodern
      - name: Compile report
        working-directory: report
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error Project_Report.tex
      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/Project_Report.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDF is current."
          else
            git commit -m "Build capstone report PDF"
            git push origin submission-ready
          fi
