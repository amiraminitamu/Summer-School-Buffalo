name: Repository checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight dependencies
        run: python -m pip install numpy scipy matplotlib
      - name: Validate geometry
        run: python src/00_validate_geometry.py
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Check source-code location
        run: |
          stale=$(find 01_geometry 03_aimd -type f \( -name '*.py' -o -name '*.slurm' -o -name '*.sbatch' \) 2>/dev/null || true)
          if [ -n "$stale" ]; then
            echo "Executable source remains outside src/:"
            echo "$stale"
            exit 1
          fi
      - name: Reject accidental large files
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = [
              path for path in Path('.').rglob('*')
              if path.is_file() and '.git' not in path.parts
              and path.stat().st_size > 20_000_000
          ]
          if bad:
              raise SystemExit('Large tracked files: ' + ', '.join(map(str, bad)))
          PY
