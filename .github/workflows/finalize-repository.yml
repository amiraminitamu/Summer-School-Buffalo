name: Finalize submission repository

on:
  push:
    branches:
      - submission-ready
    paths:
      - ".github/finalize-repo/overlay.b64"
      - ".github/workflows/finalize-repository.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out submission branch
        uses: actions/checkout@v4
        with:
          ref: submission-ready
          fetch-depth: 0

      - name: Rebuild final tree
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(git rev-parse HEAD)
          mkdir -p /tmp/retained

          keep() {
            src="$1"
            dst="${2:-$1}"
            mkdir -p "/tmp/retained/$(dirname "$dst")"
            git show "$BASE:$src" > "/tmp/retained/$dst"
          }

          keep LICENSE
          keep 01_geometry/2H2Pc_C60.xyz
          keep 01_geometry/validate_geometry.py
          keep 03_aimd/experiment_shg_digitized.csv
          keep 03_aimd/production_starts/manifest.csv
          for i in $(seq -f "%02g" 0 9); do
            keep "03_aimd/production_starts/start_${i}.xyz"
          done

          keep 03_aimd/scripts/01_run_aimd.py
          keep 03_aimd/scripts/02_extract_electronic.py
          keep 03_aimd/scripts/03_track_states.py
          keep 03_aimd/scripts/04_run_fssh.py
          keep 03_aimd/scripts/05_analyze_fssh.py
          keep 03_aimd/scripts/06_build_reduced_model.py
          keep 03_aimd/scripts/10_plot_libra_experiment.py 03_aimd/scripts/07_plot_libra_experiment.py
          keep 03_aimd/scripts/11_compare_fssh_variants.py 03_aimd/scripts/08_compare_fssh_variants.py

          keep 03_aimd/slurm/01_aimd_array.slurm
          keep 03_aimd/slurm/02_electronic_array.slurm
          keep 03_aimd/slurm/03_tracking_array.slurm
          keep 03_aimd/slurm/04_libra_array.slurm

          base64 --decode .github/finalize-repo/overlay.b64 > /tmp/final-overlay.tar.gz

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/final-overlay.tar.gz -C .
          cp -a /tmp/retained/. .

          chmod +x 01_geometry/validate_geometry.py
          chmod +x 03_aimd/scripts/*.py
          chmod +x 03_aimd/slurm/*.slurm

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize coherent charge-transfer capstone"
          git push origin submission-ready
